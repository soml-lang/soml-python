name: Release
# Run it from the Actions tab after the version bump is pushed to `main`. It publishes the version in `pyproject.toml` and pushes its `v` tag.
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A release from any other branch would tag a commit that is not on `main`.
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.12.23'
          python-version: '3.14'
          enable-cache: true
      - name: Check version
        id: version
        run: |
          version="$(uv version --short)"
          tags="$(git ls-remote --tags origin "refs/tags/v$version")"
          test -z "$tags" || { echo "Tag v$version already exists" >&2; exit 1; }
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      # mypy also checks `bench`, so it needs the `bench` group.
      - run: uv sync --locked --all-groups
      - name: Tests
        run: uv run --no-sync pytest
      - name: Lint
        run: uv run --no-sync ruff check
      - name: Formatting
        run: uv run --no-sync ruff format --check
      - name: Types
        run: uv run --no-sync mypy && uv run --no-sync pyright
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Trusted publishing, which is set up on PyPI, so there is no API token in the secrets.
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.12.23'
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      # `uv publish` gets a token from PyPI by itself when it runs in GitHub Actions.
      - run: uv publish --trusted-publishing always
  tag:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # For pushing the tag.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "refs/tags/v$VERSION"
